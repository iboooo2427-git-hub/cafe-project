services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cafe_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: cafe_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe_user -d cafe_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  drinks-api:
    build: ./drinks-api
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://cafe_user:secretpassword@db:5432/cafe_db
    depends_on:
      db:
        condition: service_healthy

  food-api:
    build: ./food-api
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://cafe_user:secretpassword@db:5432/cafe_db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_DRINKS_API_URL: http://13.239.3.178:8001
      VITE_FOOD_API_URL: http://13.239.3.178:8002
    depends_on:
      - drinks-api
      - food-api

volumes:
  pgdata: